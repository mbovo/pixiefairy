name: "Tag, build, and publish"

on:
  push:
    tags: ["*"]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: pre-commit/action@v3.0.1

  tagging:
    name: "Tagging"
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      next_tag: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "Calculated next tag is ${{ steps.tag_version.outputs.new_tag }}"

  build:
    name: "Build and push wheel"
    needs: [pre-commit, tagging]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: snok/install-poetry@v1
        with:
          version: "2.2.1"
          virtualenvs-in-project: true
      - uses: extractions/setup-just@v3
      - run: just setup
      - run: just build
      - name: "Release to pypi"
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            dist/*
            LICENSE

  build-image:
    name: "Build and push Docker image"
    needs: [pre-commit, tagging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.tagging.outputs.next_tag }}
            type=raw,value=latest
            type=sha
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pixiefairy
          cache-to: type=gha,mode=max,scope=pixiefairy
