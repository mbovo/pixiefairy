[tool.black]
line-length = 180

[tool.ruff]
line-length = 172

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "C",  # flake8-comprehensions
]
# Allow unused variables when underscore-prefixed.
ignore = [
    "E501",
   "C408", # Unnecessary dict call - rewrite as a literal.
   "C901", # Function is too complex
   "C416", # Unnecessary list comprehension
]


[project]
name = "pixiefairy"
version = "0.1.4"
description = "Pixiefairy a Pixiecore API server companion"
authors = [
    { name = "Manuel Bovo", email = "manuel.bovo@gmail.com" },
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/mbovo/pixiefairy"

[project.scripts]
pixiefairy = "pixiefairy.cli:main"

[tool.poetry.dependencies]
click = "^8.4.2"
colorama = "^0.4.6"
loguru = "^0.7.3"
gevent = "^26.8.0"
PyYAML = "^6.0.3"
urllib3 = "^2.7.0"
fastapi = "^0.141.1"
uvicorn = "^0.52.4"
pydantic-yaml = "^1.7.0"
typer = "^0.27.1"
shellingham = "^1.5.4"
pydantic = "^2.13.4"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.4"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-xdist = "^3.8.0"
flake8 = "^7.3.0"
pylint = "^4.0.7"
autopep8 = "^2.3.2"
black = "^26.5.1"
pre-commit = "^4.6.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
